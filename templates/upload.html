{% extends "base.html" %}
{% block title %}上传头像 - 用户管理系统{% endblock %}
{% block content %}
<div class="card upload-card">
    <h2 class="card-title">上传头像</h2>

    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="alert alert-success">上传成功！</div>
        <div class="upload-preview">
            <img src="{{ file_url }}" alt="头像预览" class="preview-img">
        </div>
        <div class="upload-link">
            <p>文件链接：</p>
            <input type="text" class="copy-input" value="{{ file_url }}" readonly onclick="this.select()">
        </div>
        <p class="card-text">文件名：{{ filename }}</p>
        <a href="{{ url_for('upload') }}" class="btn btn-primary">继续上传</a>
    {% endif %}

    <form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data" class="form">
        <div class="form-group">
            <label for="file">选择文件</label>
            <input type="file" id="file" name="file" class="file-input" required>
        </div>
        <button type="submit" class="btn btn-primary">上 传</button>
    </form>
</div>
{% endblock %}
