<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>帮助中心</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; }
        h1 { color: #667eea; }
        h2 { color: #555; margin-top: 24px; }
        hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>帮助中心</h1>
    <p>欢迎使用用户管理系统！以下是常见问题和使用指南。</p>
    <hr>

    <h2>一、用户登录</h2>
    <p>在登录页面输入用户名和密码即可登录系统。</p>

    <h2>二、注册账号</h2>
    <p>点击导航栏的「注册」链接，填写用户名、密码、邮箱和手机号即可注册新账号。</p>

    <h2>三、搜索用户</h2>
    <p>登录后在首页搜索框中输入用户名或邮箱，即可搜索系统中的其他用户。</p>

    <h2>四、上传头像</h2>
    <p>登录后点击「上传头像」可选择图片文件上传，支持 JPG、PNG、GIF 等格式。</p>

    <h2>五、个人中心与充值</h2>
    <p>在个人中心可以查看自己的资料和余额，也可以进行充值操作。</p>

    <hr>
    <p style="color: #999; font-size: 13px;">用户管理系统 v1.0 | 技术支持请联系管理员</p>
</body>
</html>
